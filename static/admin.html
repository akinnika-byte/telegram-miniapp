<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>АВТР(ПГ) — управление</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1420);
    --card: var(--tg-theme-secondary-bg-color, #1b2233);
    --text: var(--tg-theme-text-color, #e8ecf5);
    --hint: var(--tg-theme-hint-color, #8b93a7);
    --accent: var(--tg-theme-button-color, #4f8cff);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --border: rgba(128, 140, 170, 0.25);
    --ok: #2ecc71; --bad: #ff5b5b; --warn: #ffb84d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px 44px; }
  .screen { display: none; } .screen.active { display: block; animation: fade .26s cubic-bezier(.2,.7,.3,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 800; letter-spacing: -.2px; }
  h2 { font-size: 18px; margin: 0 0 12px; font-weight: 700; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 0 16px; line-height: 1.45; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .link { color: var(--accent); font-size: 14px; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 9px; }

  /* ---- Вход ---- */
  .center { text-align: center; }
  .logo { font-size: 54px; line-height: 1; margin: 20px 0 6px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 20px 0 6px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--hint); transition: .15s; }
  .dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }
  .err { color: var(--bad); text-align: center; font-size: 14px; min-height: 20px; margin: 6px 0 12px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
  .key { height: 62px; border: none; border-radius: 16px; background: var(--card); color: var(--text);
         font-size: 24px; font-weight: 700; cursor: pointer; transition: transform .08s, background .15s; }
  .key:active { transform: scale(.92); background: var(--border); }
  .key.blank { background: transparent; pointer-events: none; }
  .powered { text-align: center; margin-top: 26px; color: var(--hint); font-size: 13px; }
  .powered b { color: var(--accent); font-weight: 800; }

  /* ---- Меню ---- */
  .role-chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(79,140,255,.14);
               color: var(--accent); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: none; border-radius: 18px; padding: 15px 16px;
    color: var(--text); margin-bottom: 10px; cursor: pointer; transition: transform .09s;
  }
  .menu-item:active { transform: scale(.98); }
  .menu-item .ico { font-size: 24px; width: 42px; height: 42px; display: flex; align-items: center;
                    justify-content: center; border-radius: 13px; background: rgba(128,140,170,.13); }
  .menu-item .t { font-size: 16px; font-weight: 700; display: block; }
  .menu-item .d { font-size: 12.5px; color: var(--hint); margin-top: 2px; }

  /* ---- Контент ---- */
  select {
    width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--text); font-size: 16px; padding: 0 12px; outline: none; margin-bottom: 14px;
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 12px; color: var(--hint); margin-top: 2px; }

  .card { background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .row .plate { font-weight: 800; font-size: 17px; letter-spacing: .5px; }
  .row .meta { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .row .right { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .badge.ok { background: rgba(46,204,113,.16); color: var(--ok); }
  .badge.bad { background: rgba(255,91,91,.16); color: var(--bad); }
  .badge.warn { background: rgba(255,184,77,.16); color: var(--warn); }
  .detail { display: none; border-top: 1px solid var(--border); }
  .detail.open { display: block; }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item .head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 14px; color: var(--hint); font-size: 13px; }
  .kv b { color: var(--text); font-weight: 600; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }
  .field input { width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--border);
                 background: var(--bg); color: var(--text); font-size: 16px; padding: 0 14px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .group-title { font-size: 12px; font-weight: 700; color: var(--hint); text-transform: uppercase;
                 letter-spacing: .4px; margin: 0 0 8px; }

  .btn { width: 100%; height: 52px; border: none; border-radius: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn + .btn { margin-top: 10px; }

  .act { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .act:last-child { border-bottom: none; }
  .act .a { display: flex; justify-content: space-between; gap: 10px; }
  .act .who { color: var(--hint); font-size: 12px; margin-top: 3px; }
  .spin { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
          border-radius: 50%; margin: 40px auto; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140%);
           background: #111; color: #fff; padding: 13px 20px; border-radius: 14px; font-size: 14px;
           transition: transform .35s; max-width: 90%; text-align: center; z-index: 50; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="fatal" style="display:none;position:fixed;top:0;left:0;right:0;background:#ff5b5b;color:#fff;padding:12px;z-index:999;font-size:13px;text-align:center"></div>
<script>
window.onerror = function (msg, src, line) {
  var el = document.getElementById("fatal");
  if (el) { el.style.display = "block"; el.textContent = "Ошибка страницы: " + msg + " (строка " + line + ")"; }
};
</script>
<div class="wrap">

  <div class="screen active" id="scr-loading"><div class="spin"></div></div>

  <!-- Вход (всегда при открытии) -->
  <div class="screen" id="scr-login">
    <div class="center">
      <div class="logo">🛠</div>
      <h1>АВТР(ПГ)</h1>
      <p class="sub">Введите код доступа</p>
    </div>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="err" id="err"></div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button><button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button><button class="key blank"></button>
      <button class="key" data-k="0">0</button><button class="key" data-k="del">⌫</button>
    </div>
    <div class="powered">powered by <b>botvinev</b></div>
  </div>

  <!-- Меню -->
  <div class="screen" id="scr-menu">
    <div class="topbar">
      <div><h1>Панель управления</h1>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <span class="role-chip" id="role-title">—</span>
          <span class="sub" id="who" style="margin:0">—</span>
        </div>
      </div>
      <button class="link" id="logout">Выйти</button>
    </div>
    <button class="menu-item" data-screen="scr-report"><span class="ico">📊</span><span><span class="t">Отчёт</span><span class="d">Путевые по машинам за период</span></span></button>
    <button class="menu-item" data-screen="scr-summary"><span class="ico">📋</span><span><span class="t">Сводка</span><span class="d">Суммы по каждой машине</span></span></button>
    <button class="menu-item" data-screen="scr-activity"><span class="ico">🕘</span><span><span class="t">Активность</span><span class="d">Кто и что делал</span></span></button>
    <button class="menu-item" data-screen="scr-vehicles"><span class="ico">🚚</span><span><span class="t">Машины</span><span class="d">Данные, документы, водители</span></span></button>
    <button class="menu-item" data-screen="scr-drivers"><span class="ico">👥</span><span><span class="t">Водители</span><span class="d">Водительский состав</span></span></button>
    <button class="menu-item" data-screen="scr-norms"><span class="ico">⛽</span><span><span class="t">Нормы расхода</span><span class="d">Топливо, моточасы, баки</span></span></button>
  </div>

  <!-- Отчёт -->
  <div class="screen" id="scr-report">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Отчёт</h2></div>
    <select id="sel-report"></select>
    <div id="report-body"><div class="spin"></div></div>
  </div>

  <!-- Сводка -->
  <div class="screen" id="scr-summary">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Сводка</h2></div>
    <select id="sel-summary"></select>
    <div id="summary-body"><div class="spin"></div></div>
  </div>

  <!-- Активность -->
  <div class="screen" id="scr-activity">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Активность</h2></div>
    <div id="activity-body"><div class="spin"></div></div>
  </div>

  <!-- Машины -->
  <div class="screen" id="scr-vehicles">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Машины</h2></div>
    <button class="btn primary" id="veh-add" style="margin-bottom:12px">➕ Добавить машину</button>
    <div id="vehicles-body"></div>
  </div>

  <!-- Нормы расхода -->
  <div class="screen" id="scr-norms">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Нормы расхода</h2></div>
    <div id="norms-body"></div>
  </div>

  <!-- Водители -->
  <div class="screen" id="scr-drivers">
    <div class="topbar"><button class="link" data-back>← Меню</button><h2 style="margin:0">Водители</h2></div>
    <div id="drivers-body"></div>
  </div>

  <!-- Форма машины -->
  <div class="screen" id="scr-form">
    <div class="topbar"><button class="link" data-backto="scr-vehicles">← Назад</button><span id="form-title" style="font-weight:700"></span></div>
    <div class="card" style="padding:16px"><div id="form"></div></div>
    <button class="btn primary" id="form-save">Сохранить</button>
    <button class="btn ghost" id="form-cancel" style="margin-top:10px">Отмена</button>
  </div>

  <!-- Карточка водителя -->
  <div class="screen" id="scr-driver-card">
    <div class="topbar"><button class="link" data-backto="scr-drivers">← Назад</button><span></span></div>
    <div id="drv-body"></div>
  </div>

  <!-- Правка путевого -->
  <div class="screen" id="scr-waybill">
    <div class="topbar"><button class="link" data-backto="scr-report">← Назад</button><span id="wb-title" style="font-weight:700"></span></div>
    <div class="card" style="padding:16px"><div class="grid2" id="wb-form"></div></div>
    <button class="btn primary" id="wb-save">Проверить и сохранить</button>
    <button class="btn ghost" id="wb-cancel" style="margin-top:10px">Отмена</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let session = null, periods = [], currentPeriod = null, pin = "";
let cache = {}, lastSig = null, editingWb = null;
const openCards = new Set();

const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  opts = opts || {};
  let ctrl = null, timer = null;
  if (typeof AbortController !== "undefined") {
    ctrl = new AbortController();
    timer = setTimeout(() => ctrl.abort(), 45000);
  }
  try {
    const res = await fetch(path, Object.assign({}, opts, {
      signal: ctrl ? ctrl.signal : undefined,
      headers: Object.assign({
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": tg ? tg.initData : "",
      }, opts.headers || {}),
    }));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Ошибка сервера");
    return data;
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("Сервер долго не отвечает — повторите попытку");
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
};
const show = (id) => { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active"); if (tg) tg.expand(); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const nf = (v, d = 1) => Number(v == null ? 0 : v).toFixed(d);
const dstr = (s) => s ? new Date(s).toLocaleDateString("ru-RU") : "—";
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2600); };

/* ---------- Запуск: всегда вход ---------- */
async function boot() {
  if (!tg || !tg.initData) {
    document.body.innerHTML = "<div class='wrap'><h1>Откройте через Telegram</h1><p class='sub'>Панель доступна только внутри мини-приложения.</p></div>";
    return;
  }
  tg.ready();
  if (location.hash === "#just") {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    try {
      session = await api("/api/session", { method: "POST" });
      if (session && session.is_admin) { await startPanel(); return; }
    } catch (e) {}
  }
  show("scr-login");
}

/* ---------- Вход ---------- */
function renderDots() { $("dots").querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("filled", i < pin.length)); }
$("keypad").addEventListener("click", (e) => {
  const k = e.target.dataset.k; if (!k) return;
  if (k === "del") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  renderDots(); $("err").textContent = "";
  if (pin.length === 4) setTimeout(login, 140);
});
async function login() {
  try {
    const data = await api("/api/login", { method: "POST", body: JSON.stringify({ code: pin }) });
    if (data.kind === "driver") { window.location.href = "/"; return; }
    session = await api("/api/session", { method: "POST" });
    await startPanel();
  } catch (e) { $("err").textContent = e.message; pin = ""; renderDots(); }
}
$("logout").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (e) {}
  window.location.href = "/";
});

/* ---------- Загрузка всех данных сразу ---------- */
async function loadPeriods() {
  periods = await api("/api/periods");
  const today = new Date().toISOString().slice(0, 10);
  const cur = periods.find(p => p.start_date <= today && today <= p.end_date);
  currentPeriod = cur ? cur.id : (periods[0] ? periods[0].id : null);
  const opts = periods.map(p =>
    `<option value="${p.id}">${esc(p.name)} — ${p.start_date} … ${p.end_date}</option>`).join("");
  ["sel-report", "sel-summary"].forEach(id => {
    $(id).innerHTML = opts;
    if (currentPeriod) $(id).value = currentPeriod;
  });
}

async function refreshAll() {
  if (!currentPeriod) return;
  const [report, summary, activity, vehicles, drivers] = await Promise.all([
    api(`/api/admin/report?period_id=${currentPeriod}`).catch(e => ({ error: e.message })),
    api(`/api/admin/summary?period_id=${currentPeriod}`).catch(e => ({ error: e.message })),
    api("/api/admin/activity?limit=100").catch(e => ({ error: e.message })),
    api("/api/admin/vehicles").catch(e => ({ error: e.message })),
    api("/api/admin/drivers").catch(e => ({ error: e.message })),
  ]);
  cache = { report, summary, activity, vehicles, drivers };
  lastSig = (report && report.sig) || null;
}

async function startPanel() {
  $("role-title").textContent = session.role_title || "Администратор";
  $("who").textContent = session.name || "";
  show("scr-menu");
  try {
    await loadPeriods();
    await refreshAll();
  } catch (e) { toast(e.message); }
}

/* ---------- Навигация ---------- */
document.querySelectorAll(".menu-item").forEach(b => b.addEventListener("click", () => {
  const id = b.dataset.screen;
  show(id);
  renderScreen(id);
}));
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => show("scr-menu")));
document.querySelectorAll("[data-backto]").forEach(b => b.addEventListener("click", () => {
  show(b.dataset.backto); renderScreen(b.dataset.backto);
}));

function renderScreen(id) {
  if (id === "scr-report") return renderReport();
  if (id === "scr-summary") return renderSummary();
  if (id === "scr-activity") return renderActivity();
  if (id === "scr-vehicles") return renderVehicles($("vehicles-body"), "full");
  if (id === "scr-norms") return renderVehicles($("norms-body"), "norms");
  if (id === "scr-drivers") return renderDrivers();
}

["sel-report", "sel-summary"].forEach(sel => $(sel).addEventListener("change", async (e) => {
  currentPeriod = parseInt(e.target.value, 10);
  const other = e.target.id === "sel-report" ? "sel-summary" : "sel-report";
  $(other).value = currentPeriod;
  await refreshAll();
  renderReport(); renderSummary();
}));

/* ---------- Отчёт ---------- */
function renderReport() {
  const box = $("report-body");
  const data = cache.report;
  if (!data) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (data.error) { box.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
  if (!data.groups.length) { box.innerHTML = '<div class="empty">За этот период путевых листов нет</div>'; return; }
  box.innerHTML =
    `<div class="stats">
       <div class="stat"><div class="n">${data.total_count}</div><div class="t">Путёвок</div></div>
       <div class="stat"><div class="n">${data.groups.length}</div><div class="t">Машин</div></div>
       <div class="stat"><div class="n" style="color:${data.total_bad ? "var(--bad)" : "var(--ok)"}">${data.total_bad}</div><div class="t">С расхождением</div></div>
     </div>` +
    data.groups.map(g => `
      <div class="card" data-key="${esc(g.plate)}">
        <div class="row" data-toggle>
          <div><div class="plate">${esc(g.plate)}</div><div class="meta">${esc(g.model)} · путёвок: ${g.count}</div></div>
          <div class="right"><span class="badge ${g.has_bad ? "bad" : "ok"}">${g.has_bad ? "РАСХОЖДЕНИЕ" : "OK"}</span>
            <div style="margin-top:6px">${nf(g.total_km)} км · ${nf(g.fuel_spent)} л</div></div>
        </div>
        <div class="detail">${g.items.map(it => `
          <div class="item">
            <div class="head"><b>№${esc(it.waybill_no)}</b>
              <span>${it.is_corrected ? '<span class="badge warn">ИСПРАВЛЕН</span> ' : ""}<span class="badge ${it.is_ok ? "ok" : "bad"}">${it.is_ok ? "OK" : "РАСХОЖДЕНИЕ"}</span></span></div>
            <div class="kv">
              <span>Пробег: <b>${nf(it.total_km)} км</b></span>
              <span>Топл. расчёт: <b>${nf(it.fuel_calc)} л</b></span>
              <span>Получено: <b>${nf(it.fuel_in)} л</b></span>
              <span>Затрачено: <b>${nf(it.fuel_spent)} л</b></span>
              <span>Бак нач/кон: <b>${nf(it.tank_start)} / ${nf(it.tank_end)} л</b></span>
              <span>Моточасы: <b>${nf(it.motohours)}</b></span>
            </div>
            ${it.author ? `<div class="meta" style="margin-top:6px">Внёс: ${esc(it.author)}</div>` : ""}
            <button class="link" data-wb="${it.id}" style="padding:8px 0 0">✏️ Изменить</button>
          </div>`).join("")}</div>
      </div>`).join("");
  bindToggles(box);
  box.querySelectorAll("[data-wb]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    const item = findReportItem(b.dataset.wb);
    if (item) openWaybillForm(item);
  }));
}

function findReportItem(id) {
  for (const g of (cache.report ? cache.report.groups : []))
    for (const it of g.items) if (String(it.id) === String(id)) return { ...it, plate: g.plate };
  return null;
}

/* ---------- Сводка ---------- */
function renderSummary() {
  const box = $("summary-body");
  const data = cache.summary;
  if (!data) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (data.error) { box.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
  if (!data.rows.length) { box.innerHTML = '<div class="empty">Нет данных</div>'; return; }
  const t = data.totals;
  box.innerHTML =
    `<div class="stats">
       <div class="stat"><div class="n">${data.rows.length}</div><div class="t">Машин</div></div>
       <div class="stat"><div class="n">${t.wb_count}</div><div class="t">Путёвок</div></div>
       <div class="stat"><div class="n">${nf(t.total_km, 0)}</div><div class="t">Всего км</div></div>
       <div class="stat"><div class="n">${nf(t.fuel_spent, 0)}</div><div class="t">Всего топлива, л</div></div>
     </div>` +
    data.rows.map(g => `
      <div class="card" data-key="${esc(g.plate)}">
        <div class="row" data-toggle>
          <div><div class="plate">${esc(g.plate)}</div><div class="meta">${esc(g.model)} · путёвок: ${g.wb_count}</div></div>
          <div class="right"><span class="badge ${g.has_bad ? "bad" : "ok"}">${g.has_bad ? "РАСХОЖДЕНИЕ" : "OK"}</span>
            <div style="margin-top:6px">${nf(g.total_km)} км · ${nf(g.fuel_spent)} л</div></div>
        </div>
        <div class="detail">
          <div class="item" style="background:rgba(128,140,170,.08)">
            <div class="kv">
              <span>Получено: <b>${nf(g.fuel_in)} л</b></span>
              <span>Затрачено (факт): <b>${nf(g.fuel_spent)} л</b></span>
              <span>Затрачено (расчёт): <b>${nf(g.fuel_calc)} л</b></span>
              <span>Пробег: <b>${nf(g.total_km)} км</b></span>
            </div>
          </div>
          ${g.items.map(it => `
            <div class="item">
              <div class="head"><b>№${esc(it.waybill_no)}</b>
                <span>${it.is_corrected ? '<span class="badge warn">ИСПРАВЛЕН</span> ' : ""}<span class="badge ${it.is_ok ? "ok" : "bad"}">${it.is_ok ? "OK" : "РАСХОЖДЕНИЕ"}</span></span></div>
              <div class="kv">
                <span>Пробег: <b>${nf(it.total_km)} км</b></span>
                <span>Получено: <b>${nf(it.fuel_in)} л</b></span>
                <span>Затрачено: <b>${nf(it.fuel_spent)} л</b></span>
                <span>Расчёт: <b>${nf(it.fuel_calc)} л</b></span>
              </div>
            </div>`).join("")}
        </div>
      </div>`).join("");
  bindToggles(box);
}

function bindToggles(box) {
  box.querySelectorAll("[data-toggle]").forEach(r => {
    const card = r.closest(".card");
    const key = card ? card.dataset.key : null;
    const det = r.parentElement.querySelector(".detail");
    if (key && openCards.has(key)) det.classList.add("open");
    r.addEventListener("click", () => {
      det.classList.toggle("open");
      if (key) det.classList.contains("open") ? openCards.add(key) : openCards.delete(key);
    });
  });
}

/* ---------- Активность ---------- */
const ACTIONS = {
  driver_login: "Вход водителя", admin_login: "Вход администратора", logout: "Выход",
  create_waybill: "Создан путевой", update_waybill: "Изменён путевой",
  create_vehicle: "Добавлена машина", update_vehicle: "Изменена машина",
};
function renderActivity() {
  const box = $("activity-body");
  const rows = cache.activity;
  if (!rows) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (rows.error) { box.innerHTML = `<div class="empty">${esc(rows.error)}</div>`; return; }
  if (!rows.length) { box.innerHTML = '<div class="empty">Активности пока нет</div>'; return; }
  box.innerHTML = `<div class="card">` + rows.map(r => `
    <div class="act">
      <div class="a"><b>${esc(ACTIONS[r.action] || r.action)}</b>
        <span style="color:var(--hint)">${new Date(r.created_at).toLocaleString("ru-RU")}</span></div>
      ${r.actor_name ? `<div class="who">${esc(r.actor_name)}${r.role ? " · " + esc(r.role) : ""}</div>` : ""}
    </div>`).join("") + `</div>`;
}

/* ---------- Машины / Нормы ---------- */
function renderVehicles(box, mode) {
  const list = cache.vehicles;
  if (!list) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (list.error) { box.innerHTML = `<div class="empty">${esc(list.error)}</div>`; return; }
  if (!list.length) { box.innerHTML = '<div class="empty">Машин нет</div>'; return; }
  box.innerHTML = list.map(v => {
    const nums = mode === "norms"
      ? `<div class="kv"><span>Норма: <b>${v.fuel_norm} л/100км</b></span><span>Моточас: <b>${v.motohour_norm}</b></span>
         <span>Бак: <b>${v.tank_capacity} л</b></span><span>${v.is_active ? "активна" : "не активна"}</span></div>`
      : `<div class="meta">${esc(v.model)}${v.driver_name ? " · " + esc(v.driver_name) : ""}</div>`;
    return `<div class="card"><div class="row" data-plate="${esc(v.plate)}">
        <div><div class="plate">${esc(v.plate)}</div>${nums}</div>
        <div class="right" style="color:var(--accent)">изменить ›</div>
      </div></div>`;
  }).join("");
  box.querySelectorAll("[data-plate]").forEach(r => r.addEventListener("click", () => {
    const v = (cache.vehicles || []).find(x => String(x.plate) === r.dataset.plate);
    openVehicleForm(v);
  }));
}

/* ---------- Водители ---------- */
function renderDrivers() {
  const box = $("drivers-body");
  const rows = cache.drivers;
  if (!rows) { box.innerHTML = '<div class="spin"></div>'; return; }
  if (rows.error) { box.innerHTML = `<div class="empty">${esc(rows.error)}</div>`; return; }
  if (!rows.length) { box.innerHTML = '<div class="empty">Машин нет</div>'; return; }
  box.innerHTML = rows.map(d => `
    <div class="card"><div class="row" data-drv="${esc(d.plate)}">
      <div><div class="plate">${esc(d.plate)}</div>
        <div class="meta">${d.driver_name ? esc(d.driver_name) : "водитель не указан"} · путёвок: ${d.waybill_count}</div></div>
      <div class="right" style="color:var(--accent)">профиль ›</div>
    </div></div>`).join("");
  box.querySelectorAll("[data-drv]").forEach(r =>
    r.addEventListener("click", () => openDriverCard(r.dataset.drv)));
}

/* ---------- Карточка водителя ---------- */
function openDriverCard(plate) {
  show("scr-driver-card");
  $("drv-body").innerHTML = '<div class="spin"></div>';
  Promise.all([
    api("/api/admin/vehicle-waybills?plate=" + encodeURIComponent(plate)),
  ]).then(([wbs]) => {
    const r = (cache.drivers || []).find(x => String(x.plate) === plate) || {};
    $("drv-body").innerHTML = `
      <div class="card" style="padding:16px">
        <div class="kv" style="grid-template-columns:1fr">
          <div>ФИО: <b>${esc(r.driver_name || "—")}</b></div>
          <div>Звание: <b>${esc(r.driver_rank || "—")}</b></div>
          <div>Должность: <b>${esc(r.driver_position || "—")}</b></div>
          <div>Права: <b>${esc(r.driver_license || "—")}</b></div>
          <div>Закреплённая техника: <b>${esc(r.plate || plate)} · ${esc(r.model || "")}</b></div>
          <div>Закрыто документации: <b>${r.waybill_count || 0}</b></div>
        </div>
      </div>
      <button class="btn primary" id="drv-edit" style="margin-bottom:16px">Изменить данные</button>
      <h2>Путевые (${wbs.length})</h2>
      <div id="drv-wbs">${wbs.length ? "" : '<div class="empty">Путёвок нет</div>'}</div>`;
    $("drv-wbs").innerHTML = wbs.map(w => `
      <div class="card" style="padding:0">
        <div class="row" data-wbtoggle>
          <div><div class="plate">№${esc(w.waybill_no)}</div>
            <div class="meta">${esc(w.period_name)} · ${dstr(w.waybill_date || w.created_at)}</div></div>
          <div class="right">
            <span class="badge ${w.is_corrected ? "warn" : (w.is_ok ? "ok" : "bad")}">${w.is_corrected ? "ИСПРАВЛЕН" : (w.is_ok ? "OK" : "РАСХОЖДЕНИЕ")}</span>
            <div style="margin-top:6px">${nf(w.km_total_odo)} км · ${nf(w.fuel_spent)} л</div></div>
        </div>
        <div class="detail">
          <div class="item"><div class="kv">
            <span>Пробег: <b>${nf(w.km_total_odo)} км</b></span>
            <span>Топливо (расчёт): <b>${nf(w.fuel_calc)} л</b></span>
            <span>Бак нач/кон: <b>${nf(w.tank_start)} / ${nf(w.tank_end)} л</b></span>
            <span>Затрачено: <b>${nf(w.fuel_spent)} л</b></span>
            <span>Моточасы: <b>${nf(w.motohours)}</b></span>
            <span>Получено: <b>${nf(w.fuel_in)} л</b></span>
          </div></div>
        </div>
      </div>`).join("");
    $("drv-wbs").querySelectorAll("[data-wbtoggle]").forEach(rr =>
      rr.addEventListener("click", () =>
        rr.parentElement.querySelector(".detail").classList.toggle("open")));
    $("drv-edit").addEventListener("click", () => {
      const v = (cache.vehicles || []).find(x => String(x.plate) === plate);
      openVehicleForm(v);
    });
  }).catch(e => { $("drv-body").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
}

/* ---------- Форма машины ---------- */
const FORM_GROUPS = [
  ["Основное", [["plate", "ГРЗ (4 цифры)", "text"], ["model", "Модель", "text"]]],
  ["Нормы расхода", [
    ["fuel_norm", "Норма, л/100км", "decimal"],
    ["motohour_norm", "Норма, л/моточас", "decimal"],
    ["tank_capacity", "Объём бака, л", "decimal"],
  ]],
  ["Характеристики", [
    ["vin", "VIN", "text"], ["engine_no", "Двигатель", "text"], ["chassis_no", "Шасси", "text"],
  ]],
  ["Водитель", [
    ["driver_name", "ФИО", "text"], ["driver_rank", "Звание", "text"],
    ["driver_position", "Должность", "text"], ["driver_license", "Права (категории)", "text"],
  ]],
  ["Документы — срок действия", [
    ["sts_expires", "СТС до", "date"],
    ["diagnostic_card_expires", "Диагност. карта до", "date"],
    ["red_stripe_expires", "Красная полоса до", "date"],
  ]],
];
const FORM_FIELDS = [];
FORM_GROUPS.forEach(function (g) { g[1].forEach(function (f) { FORM_FIELDS.push(f); }); });
let editing = null;

function openVehicleForm(v) {
  editing = v ? { ...v } : null;
  $("form-title").textContent = v ? `Машина ${v.plate}` : "Новая машина";
  $("form").innerHTML = FORM_GROUPS.map(([title, fields]) => `
    <div style="margin-bottom:18px">
      <div class="group-title">${title}</div>
      <div class="grid2">${fields.map(([key, label, type]) => {
        let val = v && v[key] != null ? v[key] : "";
        if (type === "date" && val) val = String(val).slice(0, 10);
        const im = type === "date" ? "" : (type === "decimal" ? 'inputmode="decimal"' : 'inputmode="numeric"');
        return `<div class="field"><label>${label}</label><input id="vf-${key}" type="${type === "date" ? "date" : "text"}" ${im} value="${esc(val)}" /></div>`;
      }).join("")}</div>
    </div>`).join("");
  show("scr-form");
}
$("form-back").addEventListener("click", () => { show("scr-vehicles"); renderVehicles($("vehicles-body"), "full"); });
$("form-cancel").addEventListener("click", () => { show("scr-vehicles"); renderVehicles($("vehicles-body"), "full"); });
$("form-save").addEventListener("click", async () => {
  const body = { id: editing ? editing.id : null, is_active: true };
  FORM_FIELDS.forEach(([key]) => { const el = $("vf-" + key); body[key] = el ? el.value : ""; });
  if (!body.plate || !/^\d{4}$/.test(body.plate)) return toast("ГРЗ — ровно 4 цифры");
  try {
    await api("/api/admin/vehicles/save", { method: "POST", body: JSON.stringify(body) });
    toast("Сохранено ✓");
    cache.vehicles = await api("/api/admin/vehicles").catch(() => cache.vehicles);
    cache.drivers = await api("/api/admin/drivers").catch(() => cache.drivers);
    show("scr-vehicles"); renderVehicles($("vehicles-body"), "full");
  } catch (e) { toast(e.message); }
});

/* ---------- Правка путевого ---------- */
const WB_FIELDS = [
  ["waybill_no", "№ путевого листа", "text"],
  ["waybill_date", "Дата", "date"],
  ["km_start", "Начальный километраж", "decimal"],
  ["km_end", "Конечный километраж", "decimal"],
  ["km_empty", "Пробег без груза, км", "decimal"],
  ["km_loaded", "Пробег с грузом, км", "decimal"],
  ["tank_start", "Бак на начало, л", "decimal"],
  ["fuel_in", "Получено топлива, л", "decimal"],
  ["tank_end", "Бак на конец, л", "decimal"],
  ["fuel_spent", "Затрачено топлива, л", "decimal"],
  ["motohours", "Моточасы", "decimal"],
];
function openWaybillForm(it) {
  if (!it) return;
  editingWb = it;
  $("wb-title").textContent = `№${it.waybill_no} · ${it.plate}`;
  $("wb-form").innerHTML = WB_FIELDS.map(([k, label, type]) => {
    let val = it[k] != null ? it[k] : "";
    if (type === "date" && val) val = String(val).slice(0, 10);
    const im = type === "date" ? "" : (type === "decimal" ? 'inputmode="decimal"' : "");
    return `<div class="field"><label>${label}</label><input id="wbf-${k}" type="${type === "date" ? "date" : "text"}" ${im} value="${esc(val)}" /></div>`;
  }).join("");
  show("scr-waybill");
}
$("wb-back").addEventListener("click", () => { show("scr-report"); renderReport(); });
$("wb-cancel").addEventListener("click", () => { show("scr-report"); renderReport(); });
$("wb-save").addEventListener("click", async () => {
  const b = $("wb-save");
  const body = {
    id: editingWb.id, plate: editingWb.plate,
    waybill_no: $("wbf-waybill_no").value.trim(),
    date: $("wbf-waybill_date").value,
  };
  ["km_start", "km_end", "km_empty", "km_loaded", "tank_start",
   "fuel_in", "tank_end", "fuel_spent", "motohours"]
    .forEach(k => body[k] = parseFloat(($("wbf-" + k).value || "0").replace(",", ".")) || 0);
  if (!body.waybill_no) return toast("Укажите номер путевого листа");
  try {
    b.disabled = true; b.textContent = "Сохраняем…";
    const data = await api("/api/waybill/save", { method: "POST", body: JSON.stringify(body) });
    toast(data.is_ok ? "Исправлено ✓" : "Сохранено, но есть расхождения");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    await refreshAll();
    show("scr-report"); renderReport();
  } catch (e) { toast(e.message); }
  finally { b.disabled = false; b.textContent = "Проверить и сохранить"; }
});

/* ---------- Живое обновление: только при изменениях ---------- */
setInterval(async () => {
  if (document.visibilityState !== "visible") return;
  if (!currentPeriod) return;
  const act = document.querySelector(".screen.active");
  try {
    const { sig } = await api(`/api/admin/version?period_id=${currentPeriod}`);
    if (lastSig !== null && sig !== lastSig) {
      await refreshAll();
      if (act && (act.id === "scr-report" || act.id === "scr-summary")) renderScreen(act.id);
    }
    lastSig = sig;
  } catch (e) {}
}, 8000);

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  const act = document.querySelector(".screen.active");
  if (!act || act.id === "scr-login" || act.id === "scr-loading") return;
  try {
    await refreshAll();
    renderScreen(act.id);
  } catch (e) {}
});

/* Страховка: если экран загрузки висит дольше 12 секунд — покажем выход */
setTimeout(function () {
  const s = $("scr-loading");
  if (s && s.classList.contains("active")) {
    s.innerHTML = '<div class="empty">Не удалось загрузить панель.<br><br>' +
      '<button class="btn primary" onclick="location.href=\'/\'">Вернуться на главную</button></div>';
  }
}, 12000);

renderDots();
boot();
</script>
</body>
</html>
