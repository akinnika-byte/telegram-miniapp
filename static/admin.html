<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>АВТР(ПГ) — админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1420);
    --card: var(--tg-theme-secondary-bg-color, #1b2233);
    --text: var(--tg-theme-text-color, #e8ecf5);
    --hint: var(--tg-theme-hint-color, #8b93a7);
    --accent: var(--tg-theme-button-color, #4f8cff);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --border: rgba(128, 140, 170, 0.25);
    --ok: #2ecc71; --bad: #ff5b5b; --warn: #ffb84d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
  .screen { display: none; } .screen.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 800; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 0 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .link { color: var(--accent); font-size: 14px; background: none; border: none; cursor: pointer; padding: 6px; }

  select {
    width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--text); font-size: 16px; padding: 0 12px; outline: none; margin-bottom: 14px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .tab {
    flex: 0 0 auto; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--border);
    background: transparent; color: var(--hint); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 12px; color: var(--hint); margin-top: 2px; }

  .card { background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .row .plate { font-weight: 800; font-size: 17px; letter-spacing: .5px; }
  .row .meta { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .row .right { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .badge.ok { background: rgba(46,204,113,.16); color: var(--ok); }
  .badge.bad { background: rgba(255,91,91,.16); color: var(--bad); }
  .detail { display: none; border-top: 1px solid var(--border); }
  .detail.open { display: block; }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item .head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .item .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 14px; color: var(--hint); font-size: 13px; }
  .item .kv b { color: var(--text); font-weight: 600; }
  .author { color: var(--hint); font-size: 12px; margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--hint); font-weight: 600; font-size: 12px; }
  tr.total td { font-weight: 800; }

  .act { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .act:last-child { border-bottom: none; }
  .act .a { display: flex; justify-content: space-between; gap: 10px; }
  .act .who { color: var(--hint); font-size: 12px; margin-top: 3px; }
  .spin { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
          border-radius: 50%; margin: 40px auto; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; font-size: 14px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
  .key { height: 62px; border: none; border-radius: 16px; background: var(--card); color: var(--text);
         font-size: 24px; font-weight: 700; cursor: pointer; }
  .key:active { transform: scale(.94); }
  .key.wide { font-size: 16px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 20px 0 8px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--hint); }
  .dot.filled { background: var(--accent); border-color: var(--accent); }
  .err { color: var(--bad); text-align: center; font-size: 14px; min-height: 20px; margin: 6px 0 12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="screen active" id="scr-loading"><div class="spin"></div></div>

  <!-- Вход по коду -->
  <div class="screen" id="scr-login">
    <div style="text-align:center;margin-top:20px">
      <div style="font-size:52px">🛠</div>
      <h1>Вход администратора</h1>
      <p class="sub">Введите код доступа</p>
    </div>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="err" id="err"></div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button><button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button><button class="key wide" data-k="empty"></button>
      <button class="key" data-k="0">0</button><button class="key wide" data-k="del">⌫</button>
    </div>
  </div>

  <!-- Панель -->
  <div class="screen" id="scr-panel">
    <div class="topbar">
      <div><h1 id="role-title">Админ</h1><p class="sub" id="who">—</p></div>
      <button class="link" id="logout">Выйти</button>
    </div>

    <select id="period-select"></select>
    <div class="tabs">
      <button class="tab active" data-tab="report">Отчёт</button>
      <button class="tab" data-tab="summary">Сводка</button>
      <button class="tab" data-tab="activity">Активность</button>
    </div>

    <div id="tab-report"><div class="spin"></div></div>
    <div id="tab-summary" style="display:none"><div class="spin"></div></div>
    <div id="tab-activity" style="display:none"><div class="spin"></div></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let session = null, periods = [], currentPeriod = null, pin = "";
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts, headers: {
    "Content-Type": "application/json", "X-Telegram-Init-Data": tg ? tg.initData : "", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Ошибка сервера");
  return data;
};
const show = (id) => { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); if (tg) tg.expand(); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const nf = (v, d = 1) => Number(v).toFixed(d);

async function boot() {
  if (!tg || !tg.initData) { document.body.innerHTML = "<div class='wrap'><h1>Откройте через Telegram</h1><p class='sub'>Панель доступна только внутри мини-приложения.</p></div>"; return; }
  tg.ready();
  try { session = await api("/api/session"); }
  catch (e) { document.body.innerHTML = "<div class='wrap'><h1>Ошибка</h1><p class='sub'>" + esc(e.message) + "</p></div>"; return; }
  if (!session.is_admin) { show("scr-login"); return; }
  startPanel();
}

/* ---------- PIN ---------- */
function renderDots() { $("dots").querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("filled", i < pin.length)); }
$("keypad").addEventListener("click", (e) => {
  const k = e.target.dataset.k; if (!k || k === "empty") return;
  if (k === "del") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  renderDots(); $("err").textContent = "";
  if (pin.length === 4) setTimeout(login, 120);
});
async function login() {
  try {
    await api("/api/admin/login", { method: "POST", body: JSON.stringify({ code: pin }) });
    session = await api("/api/session");
    startPanel();
  } catch (e) { $("err").textContent = e.message; pin = ""; renderDots(); }
}

/* ---------- Панель ---------- */
async function startPanel() {
  show("scr-panel");
  $("role-title").textContent = session.role_title || "Администратор";
  $("who").textContent = session.name || "";
  try {
    periods = await api("/api/periods");
    $("period-select").innerHTML = periods.map(p =>
      `<option value="${p.id}">${esc(p.name)} — ${p.start_date} … ${p.end_date}${p.is_open ? "" : " (закрыт)"}</option>`).join("");
    if (periods.length) { currentPeriod = periods[0].id; loadReport(); loadActivity(); }
  } catch (e) { $("tab-report").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

$("period-select").addEventListener("change", (e) => {
  currentPeriod = parseInt(e.target.value, 10);
  const active = document.querySelector(".tab.active").dataset.tab;
  if (active === "report") loadReport();
  else if (active === "summary") loadSummary();
});

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const tab = t.dataset.tab;
  ["report","summary","activity"].forEach(n => $("tab-" + n).style.display = n === tab ? "" : "none");
  if (tab === "report") loadReport();
  else if (tab === "summary") loadSummary();
  else loadActivity();
}));

$("logout").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (e) {}
  window.location.href = "/";
});

/* ---------- Отчёт ---------- */
async function loadReport() {
  if (!currentPeriod) return;
  const box = $("tab-report"); box.innerHTML = '<div class="spin"></div>';
  try {
    const data = await api("/api/admin/report?period_id=" + currentPeriod);
    if (!data.groups.length) { box.innerHTML = '<div class="empty">За этот период путевых листов нет</div>'; return; }
    box.innerHTML =
      `<div class="stats">
         <div class="stat"><div class="n">${data.total_count}</div><div class="t">Путёвок</div></div>
         <div class="stat"><div class="n">${data.groups.length}</div><div class="t">Машин</div></div>
         <div class="stat"><div class="n" style="color:${data.total_bad ? "var(--bad)" : "var(--ok)"}">${data.total_bad}</div><div class="t">С расхождением</div></div>
       </div>` +
      data.groups.map(g => `
        <div class="card">
          <div class="row" data-toggle>
            <div><div class="plate">${esc(g.plate)}</div><div class="meta">${esc(g.model)} · путёвок: ${g.count}</div></div>
            <div class="right">
              <span class="badge ${g.has_bad ? "bad" : "ok"}">${g.has_bad ? "РАСХОЖДЕНИЕ" : "OK"}</span>
              <div style="margin-top:6px">${nf(g.total_km)} км · ${nf(g.fuel_spent)} л</div>
            </div>
          </div>
          <div class="detail">
            ${g.items.map(it => `
              <div class="item">
                <div class="head"><b>№${esc(it.waybill_no)}</b><span class="badge ${it.is_ok ? "ok" : "bad"}">${it.is_ok ? "OK" : "РАСХОЖДЕНИЕ"}</span></div>
                <div class="kv">
                  <span>Пробег: <b>${nf(it.total_km)} км</b></span>
                  <span>Топл. расчёт: <b>${nf(it.fuel_calc)} л</b></span>
                  <span>Получено: <b>${nf(it.fuel_in)} л</b></span>
                  <span>Затрачено: <b>${nf(it.fuel_spent)} л</b></span>
                  <span>Бак нач/кон: <b>${nf(it.tank_start)} / ${nf(it.tank_end)} л</b></span>
                  <span>Моточасы: <b>${nf(it.motohours)}</b></span>
                </div>
                ${it.author ? `<div class="author">Внёс: ${esc(it.author)}</div>` : ""}
              </div>`).join("")}
          </div>
        </div>`).join("");

    box.querySelectorAll("[data-toggle]").forEach(r =>
      r.addEventListener("click", () => r.parentElement.querySelector(".detail").classList.toggle("open")));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- Сводка ---------- */
async function loadSummary() {
  if (!currentPeriod) return;
  const box = $("tab-summary"); box.innerHTML = '<div class="spin"></div>';
  try {
    const data = await api("/api/admin/summary?period_id=" + currentPeriod);
    if (!data.rows.length) { box.innerHTML = '<div class="empty">Нет данных</div>'; return; }
    const t = data.totals;
    box.innerHTML = `
      <div class="card" style="padding:14px 16px">
        <table>
          <thead><tr><th>ГРЗ</th><th>Пут.</th><th>Пробег</th><th>Получ.</th><th>Затр.</th><th>Расч.</th></tr></thead>
          <tbody>
          ${data.rows.map(r => `<tr>
            <td>${esc(r.plate)}</td><td>${r.wb_count}</td>
            <td>${nf(r.total_km)}</td><td>${nf(r.fuel_in)}</td><td>${nf(r.fuel_spent)}</td><td>${nf(r.fuel_calc)}</td>
          </tr>`).join("")}
          <tr class="total"><td>ИТОГО</td><td>${t.wb_count}</td>
            <td>${nf(t.total_km)}</td><td>${nf(t.fuel_in)}</td><td>${nf(t.fuel_spent)}</td><td>${nf(t.fuel_calc)}</td></tr>
          </tbody>
        </table>
      </div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- Активность ---------- */
const ACTIONS = {
  driver_login: "Вход водителя", admin_login: "Вход администратора", logout: "Выход",
  create_waybill: "Создан путевой", update_waybill: "Изменён путевой",
  delete_waybill: "Удалён путевой", update_vehicle: "Изменена машина",
};
async function loadActivity() {
  const box = $("tab-activity"); box.innerHTML = '<div class="spin"></div>';
  try {
    const rows = await api("/api/admin/activity?limit=100");
    if (!rows.length) { box.innerHTML = '<div class="empty">Активности пока нет</div>'; return; }
    box.innerHTML = `<div class="card">` + rows.map(r => `
      <div class="act">
        <div class="a"><b>${esc(ACTIONS[r.action] || r.action)}</b>
          <span style="color:var(--hint)">${new Date(r.created_at).toLocaleString("ru-RU")}</span></div>
        ${r.actor_name ? `<div class="who">${esc(r.actor_name)}${r.role ? " · " + esc(r.role) : ""}</div>` : ""}
      </div>`).join("") + `</div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

renderDots();
boot();
</script>
</body>
</html>
